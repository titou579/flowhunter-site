services:
  - type: web
    name: flowhunter-site
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: ADMIN_USER
        value: flowhunter
      - key: ADMIN_PASS
        value: titou.biEn19=
      - key: AUTH_SECRET
        generateValue: true
      - key: ADMIN_PATH
        value: admin-flowhunter
      - key: STORAGE_DIR
        value: /data
      - key: NODE_VERSION
        value: 20.11.0
      - key: SYNC_TOKEN
        sync: false
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
